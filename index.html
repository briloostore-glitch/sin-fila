<style>
:root{--bg:#eef3f6;--ink:#0e2a47;--mute:#56708a;--card:#fff;--line:#d5e0e8;--acc:#00806d;--on:#fff;--warn:#b45309;--soft:#e3f3ef;--map:#e9f0e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a2b;--ink:#e8f1f8;--mute:#8fa8bf;--card:#12263b;--line:#24425e;--acc:#2dd4b4;--on:#06201b;--warn:#fbbf24;--soft:#0f3a38;--map:#102b2a}}
:root[data-theme="dark"]{--bg:#0b1a2b;--ink:#e8f1f8;--mute:#8fa8bf;--card:#12263b;--line:#24425e;--acc:#2dd4b4;--on:#06201b;--warn:#fbbf24;--soft:#0f3a38;--map:#102b2a}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 90px}
h1{font-size:1.8rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:16px 0 10px}
.sub{color:var(--mute);margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{width:100%;background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;cursor:pointer;margin-top:12px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.sm{width:auto;padding:9px 14px;margin:8px 8px 0 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--acc);color:var(--on)}
.t{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.t:hover,.t:focus-visible{border-color:var(--acc);outline:0}
.t b{display:block}.t span{font-size:.85rem;color:var(--mute)}.t .p{font-weight:800;color:var(--acc)}
.docs{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-top:10px}
.docs ul{margin:4px 0 0;padding-left:18px}
.price{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0}
.price.tt{font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;margin-top:12px;font-weight:400}
.chk input{width:auto;margin-top:3px}
.badge{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--acc);white-space:nowrap}
.badge.w{color:var(--warn)}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.tl{display:flex;gap:4px;margin:10px 0}.tl i{flex:1;height:6px;border-radius:3px;background:var(--line)}.tl i.on{background:var(--acc)}
.meta{color:var(--mute);font-size:.85rem}
.err{color:var(--warn);font-size:.85rem;min-height:1.2em;margin-top:8px}
.hide{display:none}
.map{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:var(--map)}
.cap{font-size:.85rem;font-weight:600;margin:6px 0 2px}
.pin{font-size:1.6rem;font-weight:800;letter-spacing:.3em;text-align:center;background:var(--soft);border-radius:10px;padding:8px;margin-top:10px}
.pv{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:6px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph figure{margin:0}.ph img{width:100%;height:80px;object-fit:cover;border-radius:8px}.ph figcaption{font-size:.7rem;color:var(--mute)}
.stars{display:flex;gap:6px;margin-top:8px}
.stars button{font-size:1.6rem;background:none;border:0;cursor:pointer;color:var(--warn);padding:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats b{font-size:1.2rem;display:block}.stats span{font-size:.8rem;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 4px;cursor:pointer;border-radius:10px}
nav button[aria-current=page]{color:var(--acc);background:var(--soft)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
.lh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:800}
.brand img{width:52px;height:auto;background:#fff;border-radius:12px;padding:4px}
.brand b{color:var(--ink)}.brand span{color:var(--acc)}
.lnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lnav .lk{background:none;border:0;color:var(--mute);font:inherit;font-weight:600;cursor:pointer;padding:8px}
.lnav .btn{width:auto;margin:0;padding:10px 16px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:20px 0 34px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.05}
.hero img{width:100%;max-width:340px;border-radius:20px;background:#fff;display:block;margin:0 auto}
.hero .btn{width:auto;padding:13px 20px;margin:12px 10px 0 0}
.sec{padding:22px 0}.sec h2{font-size:1.5rem;margin:0 0 14px}
.svc,.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.svc .card,.steps .card{margin:0}
.steps .card::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--on);font-weight:800;margin-bottom:8px}
.band{background:var(--soft);border-radius:16px;padding:22px;margin:10px 0}
.band ul{margin:8px 0 0;padding-left:20px}
footer.lf{color:var(--mute);font-size:.85rem;padding:24px 0 0;border-top:1px solid var(--line);margin-top:28px}
#splash{position:fixed;inset:0;z-index:50;background:#0e2a47;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s,visibility .45s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-card{position:relative;overflow:hidden;background:#fff;border-radius:32px;padding:18px;width:min(260px,62vw);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:sppop .7s cubic-bezier(.2,1.3,.4,1) both}
.sp-card img{width:100%;display:block;border-radius:14px}
.sp-card::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(45,212,180,.35),transparent);animation:spshine 1s .7s ease-out both}
.sp-bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.sp-bar i{display:block;height:100%;background:#2dd4b4;transform:translateX(-100%);animation:spload 1.7s .3s ease-in-out forwards}
@keyframes sppop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spshine{to{left:130%}}
@keyframes spload{to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.sp-card,.sp-card::after,.sp-bar i{animation:none}.sp-bar i{transform:none}}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--soft);color:var(--acc);display:inline-grid;place-items:center;font-weight:800;flex:none}
.who{display:flex;align-items:center;gap:10px;margin:8px 0}
/* tipografía grande y gruesa */
html{font-size:112.5%}
:root{--mute:#3f5873}

function sfPush(u){
  var jobs=[];
  O.forEach(function(o){
    var mine=u.role==="a"||(u.role==="m"&&o.msgr===u.id)||(u.role==="c"&&o.uid===u.id);
    if(!mine)return;
    var cu=usr(o.uid);
    if(!cu||!cu.sid)return;
    if(!o.gid)o.gid=sfUid();
    var sig=sfSig(o);
    if(o.sbs&&o.sbh===sig)return;
    if(o.sbt&&Date.now()-o.sbt<60000)return;
    var mu=o.msgr?usr(o.msgr):null;
    var data=sfSnap(o);
    data.cname=cu.name;
    if(mu){data.mname=mu.name;data.mveh=mu.veh||{};if(mu.av)data.mav=mu.av}
    var row={state:o.state,data:data};
    if(u.role!=="c")row.courier_sid=(mu&&mu.sid)||null;
    if(o.sbs){
      jobs.push(sb.from("sf_orders").update(row).eq("id",o.gid).select("id").then(function(x){
        if(x.error&&!(x.status>=400&&x.status<500)){o.sbt=Date.now();return}
        o.sbh=sig;delete o.sbt
      },function(){o.sbt=Date.now()}))
    }else{
      row.id=o.gid;row.client_sid=cu.sid;
